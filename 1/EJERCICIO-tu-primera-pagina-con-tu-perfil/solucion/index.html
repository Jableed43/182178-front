<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- La pestaña del navegador muestra lo que dice el title -->
    <title>Diplomatura Web - Mi Inicio</title>
</head>
<body>
    <!-- Un solo h1 por página: tu nombre completo -->
    <h1>Ana Pérez Gómez</h1>

    <h2>Sobre mí</h2>

    <!-- Un párrafo con tus hobbies. El principal va resaltado con strong -->
    <p>
        Mis hobbies son leer, andar en bici y <strong>programar</strong>.
        Los fines de semana suelo salir a caminar.
    </p>

    <!-- Un enlace: href dice a dónde va, el texto dice qué ve la persona -->
    <p>
        <a href="https://developer.mozilla.org/es/" target="_blank" rel="noopener">Ir a mi sitio favorito</a>
    </p>

    <!--
        DESAFÍO: el salto de línea con br.
        br es una etiqueta VACÍA: no tiene cierre (no existe </br>) y no envuelve
        contenido, solo corta la línea ahí mismo.
        Guardá con Ctrl + S y recargá el navegador (F5) para ver el cambio.
    -->
    <p>
        Vivo en Córdoba.<br>
        Estudio la Diplomatura en Desarrollo Web.<br>
        Este es mi primer archivo HTML propio.
    </p>
</body>
</html>
