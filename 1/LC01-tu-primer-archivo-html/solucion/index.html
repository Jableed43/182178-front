<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Permite tildes y emojis; sin esto se ven símbolos rotos -->
    <meta charset="UTF-8">
    <!-- Hace que el ancho se adapte a la pantalla del celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- El texto de la pestaña del navegador -->
    <title>Mi Primera Web</title>
</head>
<body>
    <!-- Todo lo que el usuario VE va dentro del body -->
    <h1>¡Hola, mundo!</h1>
    <p>Esta es mi primera página web.</p>
</body>
</html>
